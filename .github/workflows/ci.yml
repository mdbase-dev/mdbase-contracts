name: Catalog checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out contracts
        uses: actions/checkout@v7

      - name: Read pinned engine identity
        id: sources
        run: |
          echo "repository=$(jq -r '.mdbase_engine.repository' sources.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r '.mdbase_engine.ref' sources.json)" >> "$GITHUB_OUTPUT"
          echo "package=$(jq -r '.mdbase_engine.package' sources.json)" >> "$GITHUB_OUTPUT"

      # Every pack is installed, upgraded and tested through the mdbase engine
      # that the daemon, the Obsidian plugin and the SDK run (mdbase-connect
      # runtime/), built from its `mdbase` package at the pinned commit.
      - name: Check out mdbase engine
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.sources.outputs.repository }}
          ref: ${{ steps.sources.outputs.ref }}
          path: .sources/mdbase-connect
          sparse-checkout: runtime

      - name: Install pinned Rust toolchain
        working-directory: .sources/mdbase-connect/runtime
        run: rustup toolchain install && rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .sources/mdbase-connect/runtime

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build mdbase engine
        working-directory: .sources/mdbase-connect/runtime
        run: |
          npm ci --prefix tools/wasm --no-audit --no-fund
          cargo xtask mdbase-wasm
          cd "${{ github.workspace }}/.sources/mdbase-connect/${{ steps.sources.outputs.package }}"
          npm ci --no-audit --no-fund
          npm run build:native
          npm run build
          echo "MDBASE_DIR=$PWD" >> "$GITHUB_ENV"
          echo "mdbase $(jq -r .version package.json) at $(git rev-parse HEAD)"

      - name: Install catalog dependencies
        run: npm ci

      - name: Build and verify catalog
        run: npm test

      - name: Check deterministic publication output
        run: git diff --exit-code -- dist
