kind: mdbase.catalog-pack
id: tasknotes.task
version: 0.3.0-rc.19
name: TaskNotes task type pack
description: Portable tasks whose app behaviour (templates, archive moves, status cycling, time tracking and link format) lives in a TaskNotes settings record, with a reviewed, atomic upgrade from every TaskNotes starter published before.
display:
  name: TaskNotes tasks
  summary: Manage portable Markdown tasks, assignments, dates, recurrence, reminders, and time tracking.
  category: work
  audience: general
  icon: square-check-big
  badges:
    - TaskNotes compatible
installation:
  visibility: default
  recommendation: integration-managed
  primary_type: task
  caution: Upgrades the previous starter type while preserving independent customizations. Conflicts block the whole upgrade. TaskNotes moves settings an edited type still holds into its settings record when it upgrades that type.
provides:
  - id: tasknotes.task
    version: 0.3.0-rc.6
    digest: sha256:c400ead6e218b715d86ad31125bb3d4b2e276817da6ba8065449fd0947b24d67
  - id: tasknotes.settings
    version: 1.0.0
  - id: mdbase.app-settings
    version: 1.0.0
resources:
  # Not provided for new installs: retained so task types still implementing
  # rc.5 (customised, or written by TaskNotes before it upgrades them) keep the
  # exact contract they implement.
  - kind: contract
    mode: managed
    source: contracts/tasknotes.task/0.3.0-rc.5.md
    target: _contracts/tasknotes.task.md
  - kind: contract
    mode: managed
    source: contracts/tasknotes.task/0.3.0-rc.6.md
    target: _contracts/tasknotes.task/0.3.0-rc.6.md
  - kind: type
    mode: seed
    source: types/tasknotes-task/6.md
    target: _types/task.md
    # Every starter an earlier tasknotes.task pack seeded at _types/task.md.
    upgrade_from:
      - types/tasknotes-task/5.md
      - types/tasknotes-task/4.md
      - types/tasknotes-task/3.md
      - types/tasknotes-task/2.md
      - types/tasknotes-task/1.md
  - kind: schema
    mode: managed
    source: schemas/tasknotes.task/0.3.0-rc.6.schema.json
    target: _schemas/tasknotes/tasknotes-task.schema.json
  - kind: schema
    mode: managed
    source: schemas/tasknotes.task.binding/0.3.0-rc.6.schema.json
    target: _schemas/tasknotes/tasknotes-task-binding.schema.json
  - kind: schema
    mode: managed
    source: schemas/mdbase.app-settings/1.0.0.schema.json
    target: schemas/mdbase.app-settings/1.0.0.schema.json
  - kind: contract
    mode: managed
    source: contracts/mdbase.app-settings/1.0.0.md
    target: _contracts/mdbase.app-settings/1.0.0.md
  - kind: schema
    mode: managed
    source: schemas/tasknotes.settings/1.0.0.schema.json
    target: schemas/tasknotes.settings/1.0.0.schema.json
  - kind: contract
    mode: managed
    source: contracts/tasknotes.settings/1.0.0.md
    target: _contracts/tasknotes.settings/1.0.0.md
  - kind: type
    mode: seed
    source: types/tasknotes-settings/1.md
    target: _types/tasknotes-settings.md
